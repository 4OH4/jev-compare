[project]
name = "jev-compare"
version = "0.1.0"
description = "Exploring the new AI model Jev and evaluating how it compares to traditional LLMs for zero-shot text classification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "datasets>=5.0.1",
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "ruff>=0.16.8",
]
